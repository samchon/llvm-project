name: Samchon clangd graph producer

permissions:
  contents: read

on:
  push:
    branches:
      - feat/graph-snapshots
  pull_request:
    branches:
      - release/22.x
    paths:
      - .github/workflows/samchon-clangd-graph.yml
      - clang/**
      - clang-tools-extra/clangd/**
      - llvm/include/llvm/Support/Program.h
      - llvm/lib/Support/Program.cpp
      - llvm/lib/Support/Unix/Program.inc
      - llvm/lib/Support/Windows/Program.inc
      - llvm/unittests/Support/ProgramTest.cpp

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    if: github.repository == 'samchon/llvm-project'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
    steps:
      - name: Checkout producer
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 2

      - name: Install Ninja
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install --yes ninja-build
          else
            brew install ninja
          fi

      - name: Configure
        shell: bash
        run: >-
          cmake -S llvm -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DLLVM_ENABLE_ASSERTIONS=ON
          -DLLVM_ENABLE_PROJECTS="clang;clang-tools-extra"
          -DLLVM_INCLUDE_BENCHMARKS=OFF
          -DLLVM_INCLUDE_EXAMPLES=OFF
          -DLLVM_TARGETS_TO_BUILD=Native

      - name: Build tests
        run: cmake --build build --parallel 2 --target ClangdTests SupportTests

      - name: Run unit tests
        shell: bash
        run: |
          ./build/tools/clang/tools/extra/clangd/unittests/ClangdTests
          ./build/unittests/Support/SupportTests

      - name: Run clangd regression tests
        run: cmake --build build --parallel 2 --target check-clangd
